<app-balance [transactions]="transactions()"></app-balance>

@defer (on interaction()) {
  <mat-card class="placeholder-card">
    <app-pie-chart [config]="chartConfig()" />
  </mat-card>
} @loading (minimum 1s) {
  <mat-card class="placeholder-card">
    <mat-progress-bar mode="indeterminate" />
  </mat-card>
} @placeholder (minimum 1s) {
  <mat-card class="placeholder-card">
    <button matButton="filled" class="placeholder-card-btn" #interactionClick>
      Carregar conteúdo
    </button>
  </mat-card>
}
