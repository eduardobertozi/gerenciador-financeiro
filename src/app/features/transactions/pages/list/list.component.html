<div class="actions">
  <app-search [(searchTerm)]="searchTerm" />

  <a
    matButton="filled"
    routerLink="create"
  >
    Adicionar transação
  </a>
</div>

{{ searchTerm() }}

<app-transactions-container
  class="transactions"
  [transactions]="resourceRef.value()"
>
  <ng-template
    #item
    let-item="item"
  >
    <app-transaction-item
      [transaction]="item"
      (edit)="edit($event)"
      (remove)="remove($event)"
    />
  </ng-template>
  <ng-template #noItems>
    <app-no-transactions />
  </ng-template>
</app-transactions-container>
