<h2 mat-dialog-title>{{ mergeDialogData().title }}</h2>
<mat-dialog-content>
  {{ mergeDialogData().message }}
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton [mat-dialog-close]="false">{{ mergeDialogData().cancelButtonText }}</button>
  <button matButton [mat-dialog-close]="true" cdkFocusInitial>{{ mergeDialogData().confirmButtonText }}</button>
</mat-dialog-actions>
