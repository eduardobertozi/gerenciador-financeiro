<h2 mat-dialog-title>{{ dialogData.title }}</h2>
<mat-dialog-content>
  {{ dialogData.message }}
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton [mat-dialog-close]="false">{{ dialogData.cancelButtonText }}</button>
  <button matButton [mat-dialog-close]="true" cdkFocusInitial>{{ dialogData.confirmButtonText }}</button>
</mat-dialog-actions>
